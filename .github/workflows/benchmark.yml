name: Run Noone Protocol Benchmarks

on:
  workflow_dispatch:
    inputs:
      target_model:
        description: "Single model key from TARGET_MODELS (leave empty to run all configured providers)"
        required: false
        default: ""
      max_scenarios:
        description: "Max core framing scenarios from framing_scenarios.jsonl (default: 15 -> 120 matrix tasks)"
        required: false
        default: "15"
      target_temperature:
        description: "Sampling temperature for target models (default: 0.0 for deterministic invariance)"
        required: false
        default: "0.0"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt

      - name: Run Framing & Principal Invariance Benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINIAPI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN || secrets.HUGIGNGFACEAPI }}
          TARGET_MODEL: ${{ inputs.target_model }}
          MAX_SCENARIOS: ${{ inputs.max_scenarios }}
          TARGET_TEMPERATURE: ${{ inputs.target_temperature }}
        run: python engine/main.py

      - name: Commit updated framing reports and leaderboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD.md
          git add framing_report_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No framing benchmark report changes to commit."
          else
            git commit -m "chore(benchmark): update framing invariance reports and leaderboard"
            git pull --rebase origin main
            git push
          fi
