name: Run Noone Protocol Benchmarks

on:
  workflow_dispatch:
    inputs:
      target_model:
        description: "Single model key from TARGET_MODELS (leave empty to run all configured models)"
        required: false
        default: ""
      max_scenarios:
        description: "Max scenarios to evaluate from dataset.jsonl (default: 205)"
        required: false
        default: "205"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt

      - name: Run Red-Team Benchmark Engine
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN || secrets.HUGIGNGFACEAPI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINIAPI }}
          TARGET_MODEL: ${{ inputs.target_model }}
          MAX_SCENARIOS: ${{ inputs.max_scenarios }}
        run: python engine/main.py

      - name: Commit updated benchmark reports and leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD.md
          git add report_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No benchmark report changes to commit."
          else
            git commit -m "chore(benchmark): update automated evaluation reports and leaderboard"
            git pull --rebase origin main
            git push
          fi
